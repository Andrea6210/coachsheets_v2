# DEV Profile - H2 In-Memory Database (no installation needed)
# Data persists only during the app runtime

spring.datasource.url=jdbc:h2:mem:coachsheets;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (accessible at http://localhost:8001/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
