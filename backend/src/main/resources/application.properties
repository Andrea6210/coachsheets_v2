# Server Configuration
server.port=8001

# Active profile: dev (H2 in-memory) or prod (PostgreSQL)
spring.profiles.active=${SPRING_PROFILE:dev}

# JWT Configuration
jwt.secret=${JWT_SECRET:coachsheets-super-secret-key-change-this-in-production-must-be-long}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.coachsheets=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
